name: Build AIS Track Master APK

on:
  push:
    branches: [ main ]
    paths: [ "AIS_Track_Master/**", ".github/workflows/build-ais-track-master.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIS_Track_Master
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AIS_Track_Master.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIS_Track_Master_APK
          path: AIS_Track_Master/AIS_Track_Master.apk
